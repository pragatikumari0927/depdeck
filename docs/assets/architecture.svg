<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="980" viewBox="0 0 1900 980" role="img" aria-labelledby="title desc">
  <title id="title">How depdeck builds a card deck</title>
  <desc id="desc">Your project's dependency list and the package registry with a local cache feed a shared assessment engine. That engine powers Scan, which produces a card deck as an offline page or data export; Check, which returns a pass or fail policy verdict; and AI assistant tools, which can also look up one package without a project list.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="pc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1030"/>
      <stop offset="1" stop-color="#0f2a33"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0v16" fill="none" stroke="#7c3aed" stroke-opacity=".08"/>
    </pattern>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <filter id="glow"><feGaussianBlur stdDeviation="50"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#06b6d4"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#7c3aed"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#f59e0b"/>
    </marker>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#9aa4b2"/>
    </marker>
  </defs>

  <rect width="1900" height="980" fill="url(#bg)"/>
  <circle cx="1760" cy="70" r="230" fill="#7c3aed" opacity=".16" filter="url(#glow)"/>
  <circle cx="120" cy="900" r="220" fill="#06b6d4" opacity=".12" filter="url(#glow)"/>
  <rect width="1900" height="980" fill="url(#grid)"/>

  <!-- cartridge window -->
  <rect x="28" y="28" width="1844" height="924" fill="none" stroke="#3d4450" stroke-width="4"/>
  <rect x="32" y="32" width="1836" height="56" fill="url(#titlebar)" stroke="#3d4450" stroke-width="2"/>
  <rect x="48" y="48" width="16" height="16" fill="#f59e0b"/>
  <text x="76" y="68" font-family="JetBrains Mono, IBM Plex Mono, monospace" font-size="20" font-weight="700" fill="#f0f6fc">depdeck — Under the cartridge</text>
  <g transform="translate(1788 44)" fill="#9aa4b2">
    <rect width="18" height="18" fill="#2b3340" stroke="#6e7681" stroke-width="2"/>
    <rect x="26" width="18" height="18" fill="#2b3340" stroke="#6e7681" stroke-width="2"/>
    <rect x="52" width="18" height="18" fill="#2b3340" stroke="#6e7681" stroke-width="2"/>
  </g>

  <rect x="48" y="108" width="8" height="58" fill="url(#pc)"/>
  <text x="72" y="140" font-family="IBM Plex Sans, Inter, sans-serif" font-size="36" font-weight="700" fill="#f0f6fc">How a project becomes a card deck</text>
  <text x="72" y="176" font-family="IBM Plex Sans, Inter, sans-serif" font-size="20" fill="#9aa4b2">One shared engine reads your list, looks up package facts, and feeds Scan, Check, and AI assistant tools.</text>

  <!-- INPUTS -->
  <g filter="url(#sh)">
    <rect x="72" y="280" width="360" height="150" fill="#161b22" stroke="#06b6d4" stroke-width="3"/>
    <rect x="72" y="280" width="8" height="150" fill="#06b6d4"/>
  </g>
  <text x="100" y="328" font-family="IBM Plex Sans, Inter, sans-serif" font-size="22" font-weight="700" fill="#f0f6fc">Your project's</text>
  <text x="100" y="356" font-family="IBM Plex Sans, Inter, sans-serif" font-size="22" font-weight="700" fill="#f0f6fc">dependency list</text>
  <text x="100" y="396" font-family="IBM Plex Sans, Inter, sans-serif" font-size="16" fill="#9aa4b2">The packages listed directly</text>
  <text x="100" y="416" font-family="IBM Plex Sans, Inter, sans-serif" font-size="16" fill="#9aa4b2">in the project</text>

  <g filter="url(#sh)">
    <rect x="72" y="470" width="360" height="150" fill="#161b22" stroke="#06b6d4" stroke-width="3"/>
    <rect x="72" y="470" width="8" height="150" fill="#06b6d4"/>
  </g>
  <text x="100" y="518" font-family="IBM Plex Sans, Inter, sans-serif" font-size="22" font-weight="700" fill="#f0f6fc">Package registry</text>
  <text x="100" y="546" font-family="IBM Plex Sans, Inter, sans-serif" font-size="22" font-weight="700" fill="#f0f6fc">and local cache</text>
  <text x="100" y="586" font-family="IBM Plex Sans, Inter, sans-serif" font-size="16" fill="#9aa4b2">Public package facts,</text>
  <text x="100" y="606" font-family="IBM Plex Sans, Inter, sans-serif" font-size="16" fill="#9aa4b2">remembered locally</text>

  <!-- ENGINE (larger: visual hierarchy) -->
  <g filter="url(#sh)">
    <rect x="560" y="330" width="460" height="240" fill="#1a1330" stroke="#7c3aed" stroke-width="5"/>
    <rect x="560" y="330" width="10" height="240" fill="#7c3aed"/>
  </g>
  <!-- pixel corner ticks -->
  <rect x="560" y="330" width="16" height="4" fill="#c4b5fd"/>
  <rect x="560" y="330" width="4" height="16" fill="#c4b5fd"/>
  <rect x="1004" y="330" width="16" height="4" fill="#c4b5fd"/>
  <rect x="1016" y="330" width="4" height="16" fill="#c4b5fd"/>
  <rect x="560" y="566" width="16" height="4" fill="#c4b5fd"/>
  <rect x="560" y="554" width="4" height="16" fill="#c4b5fd"/>
  <rect x="1004" y="566" width="16" height="4" fill="#c4b5fd"/>
  <rect x="1016" y="554" width="4" height="16" fill="#c4b5fd"/>
  <text x="790" y="410" text-anchor="middle" font-family="IBM Plex Sans, Inter, sans-serif" font-size="28" font-weight="700" fill="#f0f6fc">Shared assessment engine</text>
  <text x="790" y="452" text-anchor="middle" font-family="IBM Plex Sans, Inter, sans-serif" font-size="17" fill="#c4b5fd">The heart of the cartridge</text>
  <text x="790" y="492" text-anchor="middle" font-family="IBM Plex Sans, Inter, sans-serif" font-size="17" fill="#9aa4b2">Turns package facts into rarity,</text>
  <text x="790" y="516" text-anchor="middle" font-family="IBM Plex Sans, Inter, sans-serif" font-size="17" fill="#9aa4b2">freshness, and license notes</text>

  <!-- OUTPUTS: Scan / Check / AI -->
  <g filter="url(#sh)">
    <rect x="1160" y="230" width="280" height="120" fill="#161b22" stroke="#f59e0b" stroke-width="3"/>
    <rect x="1160" y="230" width="8" height="120" fill="#f59e0b"/>
  </g>
  <text x="1188" y="282" font-family="IBM Plex Sans, Inter, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Scan</text>
  <text x="1188" y="314" font-family="IBM Plex Sans, Inter, sans-serif" font-size="15" fill="#9aa4b2">Build the collection</text>

  <g filter="url(#sh)">
    <rect x="1550" y="230" width="300" height="120" fill="#161b22" stroke="#f59e0b" stroke-width="3"/>
    <rect x="1550" y="230" width="8" height="120" fill="#f59e0b"/>
  </g>
  <text x="1578" y="276" font-family="IBM Plex Sans, Inter, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Card deck</text>
  <text x="1578" y="304" font-family="IBM Plex Sans, Inter, sans-serif" font-size="15" fill="#9aa4b2">Offline page or</text>
  <text x="1578" y="324" font-family="IBM Plex Sans, Inter, sans-serif" font-size="15" fill="#9aa4b2">data export</text>

  <g filter="url(#sh)">
    <rect x="1160" y="400" width="280" height="120" fill="#161b22" stroke="#f59e0b" stroke-width="3"/>
    <rect x="1160" y="400" width="8" height="120" fill="#f59e0b"/>
  </g>
  <text x="1188" y="452" font-family="IBM Plex Sans, Inter, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Check</text>
  <text x="1188" y="484" font-family="IBM Plex Sans, Inter, sans-serif" font-size="15" fill="#9aa4b2">Apply the default policy</text>

  <g filter="url(#sh)">
    <rect x="1550" y="400" width="300" height="120" fill="#161b22" stroke="#f59e0b" stroke-width="3"/>
    <rect x="1550" y="400" width="8" height="120" fill="#f59e0b"/>
  </g>
  <text x="1578" y="452" font-family="IBM Plex Sans, Inter, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Pass or fail</text>
  <text x="1578" y="480" font-family="IBM Plex Sans, Inter, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">policy verdict</text>

  <g filter="url(#sh)">
    <rect x="1160" y="570" width="280" height="120" fill="#161b22" stroke="#f59e0b" stroke-width="3"/>
    <rect x="1160" y="570" width="8" height="120" fill="#f59e0b"/>
  </g>
  <text x="1188" y="618" font-family="IBM Plex Sans, Inter, sans-serif" font-size="22" font-weight="700" fill="#f0f6fc">AI assistant</text>
  <text x="1188" y="644" font-family="IBM Plex Sans, Inter, sans-serif" font-size="22" font-weight="700" fill="#f0f6fc">tools</text>
  <text x="1188" y="672" font-family="IBM Plex Sans, Inter, sans-serif" font-size="15" fill="#9aa4b2">Browse, check, or render</text>

  <!-- orthogonal connectors -->
  <!-- list -> engine -->
  <path d="M432 355 H496 V420 H554" fill="none" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrC)"/>
  <!-- registry -> engine -->
  <path d="M432 545 H496 V480 H554" fill="none" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrC)"/>
  <!-- engine -> scan -->
  <path d="M1020 390 H1080 V290 H1154" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrP)"/>
  <!-- engine -> check -->
  <path d="M1020 450 H1154" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrP)"/>
  <!-- engine -> AI tools -->
  <path d="M1020 510 H1080 V630 H1154" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrP)"/>
  <!-- scan -> card deck -->
  <path d="M1440 290 H1544" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrA)"/>
  <!-- check -> verdict -->
  <path d="M1440 460 H1544" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrA)"/>
  <!-- dashed: registry to AI tools for lookup without a project list -->
  <path d="M252 620 V736 H1300 V694" fill="none" stroke="#9aa4b2" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrM)"/>
  <rect x="430" y="698" width="420" height="28" fill="#0d1117"/>
  <text x="640" y="718" text-anchor="middle" font-family="IBM Plex Sans, Inter, sans-serif" font-size="14" fill="#9aa4b2">Can look up one package without a project list</text>

  <!-- legend -->
  <line x1="72" y1="780" x2="1828" y2="780" stroke="#3d4450" stroke-width="2"/>
  <text x="72" y="816" font-family="IBM Plex Sans, Inter, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">Legend</text>
  <rect x="72" y="836" width="18" height="18" fill="#06b6d4"/>
  <text x="98" y="851" font-family="IBM Plex Sans, Inter, sans-serif" font-size="15" fill="#c9d1d9">Inputs</text>
  <rect x="200" y="836" width="18" height="18" fill="#7c3aed"/>
  <text x="226" y="851" font-family="IBM Plex Sans, Inter, sans-serif" font-size="15" fill="#c9d1d9">Shared engine</text>
  <rect x="400" y="836" width="18" height="18" fill="#f59e0b"/>
  <text x="426" y="851" font-family="IBM Plex Sans, Inter, sans-serif" font-size="15" fill="#c9d1d9">Results</text>
  <path d="M580 845 H640" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrP)"/>
  <text x="652" y="851" font-family="IBM Plex Sans, Inter, sans-serif" font-size="15" fill="#c9d1d9">Data flow</text>
  <path d="M800 845 H860" fill="none" stroke="#9aa4b2" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrM)"/>
  <text x="872" y="851" font-family="IBM Plex Sans, Inter, sans-serif" font-size="15" fill="#c9d1d9">Lookup without a project list</text>
  <text x="72" y="900" font-family="IBM Plex Sans, Inter, sans-serif" font-size="14" fill="#6e7681">Colors are paired with labels and left-edge bars, so the meaning does not depend on color alone. This view matches the current product: Scan, Check, and AI assistant tools all use the same engine.</text>
</svg>
