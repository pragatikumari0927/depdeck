name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.9', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
      - run: go mod verify
      - run: go vet ./...
      - if: runner.os == 'Linux' && matrix.go != 'stable'
        run: go test -race ./...
      - name: Race tests with coverage
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: go test -race -covermode=atomic -coverprofile="$RUNNER_TEMP/coverage.out" ./...
      - name: Report Go statement coverage
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: |
          go tool cover -func="$RUNNER_TEMP/coverage.out" > "$RUNNER_TEMP/coverage.txt"
          {
            echo '### Go statement coverage'
            echo
            echo '~~~text'
            tail -n 1 "$RUNNER_TEMP/coverage.txt"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Go coverage profile
        if: runner.os == 'Linux' && matrix.go == 'stable'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-linux-stable
          path: ${{ runner.temp }}/coverage.out
          if-no-files-found: error
      - if: runner.os != 'Linux'
        run: go test ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/codex-go-checks.test.cjs
      - run: node --test scripts/deck-filter.test.cjs
      - name: Install pinned checks
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: golangci-lint run ./...
      - name: Vulnerabilities
        run: |
          govulncheck -version
          govulncheck ./...
      - name: Secrets in candidate history and source
        run: |
          gitleaks git . --redact=100 --log-opts=HEAD
          gitleaks dir . --redact=100