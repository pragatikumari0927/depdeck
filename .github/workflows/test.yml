name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.11', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
      - run: go mod verify
      - run: go vet ./...
      - if: runner.os == 'Linux' && matrix.go != 'stable'
        run: go test -race ./...
      - name: Race tests with coverage
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: go test -race -covermode=atomic -coverprofile="$RUNNER_TEMP/coverage.out" ./...
      - name: Report Go statement coverage
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: |
          go tool cover -func="$RUNNER_TEMP/coverage.out" > "$RUNNER_TEMP/coverage.txt"
          {
            echo '### Go statement coverage'
            echo
            echo '~~~text'
            tail -n 1 "$RUNNER_TEMP/coverage.txt"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Go coverage profile
        if: runner.os == 'Linux' && matrix.go == 'stable'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-linux-stable
          path: ${{ runner.temp }}/coverage.out
          if-no-files-found: error
      - if: runner.os != 'Linux'
        run: go test ./...

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install pinned Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/depdeck-browser-tools" --no-save --no-package-lock playwright@1.65.0
          "$RUNNER_TEMP/depdeck-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Allow Chromium's user-namespace sandbox
        # Ubuntu 24.04 runner images block unprivileged user namespaces through
        # AppArmor, and Chromium's sandbox needs them ("No usable sandbox").
        # Lift that restriction on this disposable runner VM so Chromium runs
        # with its sandbox on, instead of passing --no-sandbox.
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Verify generated Pixel Archive in Chromium
        run: |
          export DEPDECK_CHROMIUM="$(node -e 'const { chromium } = require(process.env.RUNNER_TEMP + "/depdeck-browser-tools/node_modules/playwright"); process.stdout.write(chromium.executablePath())')"
          node scripts/verify-deck-reflow.cjs "$DEPDECK_CHROMIUM"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - run: node scripts/codex-go-checks.test.cjs
      - run: node --test scripts/deck-filter.test.cjs
      - run: python -m unittest scripts.test_quality_gate -v
      - name: Install pinned checks
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: golangci-lint run ./...
      - name: Vulnerabilities
        run: |
          govulncheck -version
          govulncheck ./...
      - name: Secrets in candidate history and source
        run: |
          gitleaks git . --redact=100 --log-opts=HEAD
          gitleaks dir . --redact=100

  quality-gate:
    if: always()
    needs: [test, browser, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all quality jobs to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: python scripts/check_quality_gate.py "$TEST_RESULT" "$BROWSER_RESULT" "$SECURITY_RESULT"
