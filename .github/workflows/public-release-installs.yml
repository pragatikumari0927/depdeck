name: public release installs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-release-installs.yml'
      - 'scripts/verify-release.py'
  workflow_dispatch:
    inputs:
      tag:
        description: Published Depdeck tag to verify
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

jobs:
  public-go:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v1.0.0' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.4'
          cache: false
      - name: Install the tagged module through the public Go proxy
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          install_dir="$(mktemp -d "$RUNNER_TEMP/depdeck-go.XXXXXX")"
          cd "$install_dir"
          GOMODCACHE="$install_dir/mod" GOBIN="$install_dir/bin" GOWORK=off \
            GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
            go install "github.com/pragatikumari0927/depdeck/cmd/depdeck@$RELEASE_TAG"
          go version -m "$install_dir/bin/depdeck"
          python3 "$GITHUB_WORKSPACE/scripts/verify-release.py" --binary "$install_dir/bin/depdeck" --version "$RELEASE_TAG"

  public-homebrew:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v1.0.0' }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install and test from the public Homebrew tap
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          brew install pragatikumari0927/tap/depdeck
          brew test pragatikumari0927/tap/depdeck
          python3 scripts/verify-release.py --binary "$(brew --prefix pragatikumari0927/tap/depdeck)/bin/depdeck" --version "${RELEASE_TAG#v}"