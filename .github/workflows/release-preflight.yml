name: release preflight

on:
  push:
    branches: ['codex/depdeck-v1-rc', 'codex/release-blockers']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archives:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release verifier
        run: python3 -m unittest scripts.test_verify_release -v
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
      - name: Scan with the release compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = 'go1.27.4'
          go mod download
          GOBIN="$RUNNER_TEMP" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          GOPROXY=off "$RUNNER_TEMP/govulncheck" -show version ./...
      - name: Verify offline snapshot
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/goreleaser.tar.gz"
          curl -fsSL https://github.com/goreleaser/goreleaser/releases/download/v2.20.3/goreleaser_Linux_x86_64.tar.gz -o "$archive"
          echo "a36d5d7d07a5e538e052cef2a9f93f1cd4af493cf5a3712b9177c1ebe360f0e7  $archive" | sha256sum -c
          tar -xzf "$archive" -C "$RUNNER_TEMP" goreleaser
          "$RUNNER_TEMP/goreleaser" check
          GOPROXY=off "$RUNNER_TEMP/goreleaser" release --snapshot --skip=publish
          python3 scripts/verify-release.py dist --expect-render-deck --expected-go-version go1.27.4 --govulncheck "$RUNNER_TEMP/govulncheck"
      - name: Verify isolated Go install
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d "$RUNNER_TEMP/go-install.XXXXXX")"
          GOBIN="$install_dir" GOPROXY=off go install ./cmd/depdeck
          python3 scripts/verify-release.py --binary "$install_dir/depdeck" --version dev --expect-render-deck --expected-go-version go1.27.4

  homebrew:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install and test the staged source formula
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d "$RUNNER_TEMP/depdeck-source.XXXXXX")"
          git archive --format=tar.gz --prefix=depdeck-1.0.0/ HEAD > "$source_dir/depdeck-1.0.0.tar.gz"
          cd "$source_dir"
          python3 -u -m http.server 0 --bind 127.0.0.1 > server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          port=""
          for _ in {1..50}; do
            port="$(sed -nE 's/.*port ([0-9]+).*/\1/p' server.log)"
            if [[ -n "$port" ]]; then break; fi
            sleep 0.2
          done
          test -n "$port"
          tap="$(brew --repository)/Library/Taps/depdeck/homebrew-preflight"
          git init "$tap"
          cd "$GITHUB_WORKSPACE"
          node scripts/release-formula.mjs v1.0.0 "$source_dir/depdeck-1.0.0.tar.gz" "$tap/Formula/depdeck.rb" "http://127.0.0.1:$port/depdeck-1.0.0.tar.gz"
          brew install --build-from-source depdeck/preflight/depdeck
          brew test depdeck/preflight/depdeck
          binary="$(brew --prefix depdeck/preflight/depdeck)/bin/depdeck"
          "$(brew --prefix go)/bin/go" version -m "$binary"
          python3 scripts/verify-release.py --binary "$binary" --version 1.0.0 --expect-render-deck --expected-go-version go1.27.4
